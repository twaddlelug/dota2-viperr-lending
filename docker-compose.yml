services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: viperr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viperr}
      POSTGRES_DB: viperr
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:${DB_PORT:-5432}:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U viperr]
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        PUBLIC_URL: ${PUBLIC_URL:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://viperr:${POSTGRES_PASSWORD:-viperr}@db:5432/viperr
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
